<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8e8ee"><title>Casa em Ordem</title>
<style>
:root{--p:#c77c91;--b:#fceff3;--ink:#46363c;--line:#f0dce3}*{box-sizing:border-box}body{margin:0;background:#fff9fb;color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,#f9e7ed,#fff5f7);padding:24px;border-bottom:1px solid var(--line)}main{max-width:850px;margin:auto;padding:20px}.brand{color:#a95672;font-size:12px;letter-spacing:.12em}h1{color:#8e4e65;margin:6px 0}p,.hint,.small{color:#88777d;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.days{display:flex;gap:8px;overflow:auto;margin:15px 0}.day,button{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 15px;cursor:pointer;color:var(--ink)}.day.active{background:var(--p);color:white}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin:13px 0}.card h2{font-size:17px;margin:0 0 5px}.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #f7edf0}.task input{width:22px;height:22px;accent-color:var(--p);flex-shrink:0}.task.done label{text-decoration:line-through;color:#aa9ba1}.bar{height:7px;background:#f3e4e9;border-radius:9px;overflow:hidden;margin:9px 0 18px}.fill{height:100%;background:var(--p);width:0%}
</style><header><div class="brand">🌸 ORGANIZAÇÃO DA CASA</div><h1>Casa em Ordem</h1><p>Uma rotina leve, organizada com carinho.</p></header><main><div class="row"><div><strong id="dayTitle">Rotina da semana</strong><div class="small">Gislene · Segunda a sexta · 8h às 17h</div></div><button id="clear">Desmarcar tarefas</button></div><nav class="days" id="days"></nav><div class="small" id="count"></div><div class="bar"><div class="fill" id="fill"></div></div><div id="tasks"></div><p style="text-align:center">Protótipo inicial: marcações salvas neste navegador.</p></main>
<script>
const routine=[
["Segunda-feira",[["Rotina diária",["Preparar o almoço","Lavar a louça e organizar a cozinha","Limpar potes e água do Ragnar","Limpar o local do xixi do Ragnar","Retirar lixos dos banheiros","Varrer e passar pano nas áreas comuns","Arrumar camas e berços","Organizar brinquedos e roupas dos quartos de Nicolas e Luiza"]],["Cozinha",["Limpar geladeira e retirar alimentos vencidos","Organizar despensa e verificar itens faltantes","Limpar micro-ondas e máquina de lavar louças","Limpar parte externa dos armários e bancadas"]],["Banheiros",["Trocar toalhas e tapetes dos banheiros"]]]],
["Terça-feira",[["Rotina diária",["Preparar almoço e organizar cozinha","Cuidar dos itens e do local do Ragnar","Retirar lixos e limpar áreas comuns","Arrumar camas, brinquedos e roupas das crianças"]],["Escritório e lavabo",["Limpar mesa, prateleiras, janelas e portas","Organizar objetos","Limpar lavabo, repor papel e sabonete","Trocar toalha do lavabo"]],["Banheiros das crianças",["Limpar pias, espelhos, armários e vasos","Limpeza detalhada dos boxes e chuveiros"]]]],
["Quarta-feira",[["Rotina diária",["Preparar almoço e organizar cozinha","Cuidar dos itens e do local do Ragnar","Retirar lixos e limpar áreas comuns","Arrumar camas, brinquedos e roupas das crianças"]],["Suíte e closet",["Trocar roupa de cama","Higienizar colchão conforme instruções do produto","Limpar mesas, portas e ar-condicionado","Organizar prateleiras do closet e quarto"]],["Banheiro da suíte",["Limpar espelho, bancada, armários e metais","Limpar box, ralos e banheira"]]]],
["Quinta-feira",[["Rotina diária",["Preparar almoço e organizar cozinha","Cuidar dos itens e do local do Ragnar","Retirar lixos e limpar áreas comuns","Arrumar camas, brinquedos e roupas das crianças"]],["Vidros e espelhos",["Limpar cortinas de vidro, janelas e esquadrias","Limpar espelhos e portas de vidro","Limpar boxes, prateleiras e ralos"]]]],
["Sexta-feira",[["Rotina diária",["Preparar almoço e organizar cozinha","Cuidar dos itens e do local do Ragnar","Retirar lixos e limpar áreas comuns","Arrumar camas, brinquedos e roupas das crianças"]],["Sala, hall e cristaleira",["Limpar móveis da sala e do hall","Aspirar sofás, cadeiras e tapetes","Limpar lustres","Organizar armário do hall e sapatos","Limpar pedras, prateleiras, gavetas e portas da cristaleira"]],["Varanda e quarto do Thomas",["Limpar móveis da varanda e piso","Limpar móveis, prateleiras e portas do quarto do Thomas","Varrer e passar pano no quarto"]],["Banheiros",["Trocar toalhas e tapetes dos banheiros"]]]]
];
let chosen=0;const root=document.querySelector("#tasks"),nav=document.querySelector("#days");
function taskId(d,s,t){return `co-${d}-${s}-${t}`}
function draw(){nav.innerHTML=routine.map((x,i)=>`<button class="day ${i===chosen?'active':''}" data-i="${i}">${["Seg","Ter","Qua","Qui","Sex"][i]}</button>`).join("");nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;draw()});document.querySelector("#dayTitle").textContent=routine[chosen][0];root.innerHTML=routine[chosen][1].map((sec,s)=>`<section class="card"><h2>${sec[0]}</h2><div class="hint">${sec[1].length} tarefas</div>${sec[1].map((t,i)=>{let id=taskId(chosen,s,i),v=localStorage.getItem(id)==="1";return `<div class="task ${v?'done':''}"><input id="${id}" type="checkbox" ${v?'checked':''}><label for="${id}">${t}</label></div>`}).join("")}</section>`).join("");root.querySelectorAll("input").forEach(el=>el.onchange=()=>{localStorage.setItem(el.id,el.checked?"1":"0");el.parentElement.classList.toggle("done",el.checked);progress()});progress()}
function progress(){let a=[...root.querySelectorAll("input")],n=a.filter(x=>x.checked).length;document.querySelector("#count").textContent=`${n} de ${a.length} tarefas concluídas`;document.querySelector("#fill").style.width=(a.length?100*n/a.length:0)+"%"}
document.querySelector("#clear").onclick=()=>{root.querySelectorAll("input").forEach(x=>{x.checked=false;localStorage.removeItem(x.id);x.parentElement.classList.remove("done")});progress()};draw();
</script></html>
